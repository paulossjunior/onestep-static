image: python:3.11-slim

stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -V
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate

build:
  stage: build
  script:
    - pip install -r requirements.txt
    - ls -la data/
    - cd onestep-static
    - mkdocs build --verbose
    - ls -la site/
  artifacts:
    paths:
      - onestep-static/site
    expire_in: 1 hour
  only:
    - main
    - master
    - develop

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r onestep-static/site/* public/
    - ls -la public/
  artifacts:
    paths:
      - public
  only:
    - main
    - master
  environment:
    name: production
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME

test_build:
  stage: build
  script:
    - pip install -r requirements.txt
    - ls -la data/ || echo "Warning data directory not found"
    - cd onestep-static
    - mkdocs build --verbose
  only:
    - merge_requests
  except:
    - main
    - master

validate_strict:
  stage: build
  script:
    - pip install -r requirements.txt
    - cd onestep-static
    - mkdocs build --strict --verbose || echo "Build has warnings but continuing"
  allow_failure: true
  only:
    - main
    - master
    - develop
