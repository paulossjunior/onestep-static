name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch when source files change
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - 'src/**'
      - 'onestep-static/**'
      - 'Makefile'
      - 'requirements.txt'
      - '.github/workflows/deploy-pages.yml'
  
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: make install
      
      - name: Show project status
        run: make status
      
      - name: Process research groups
        run: make process-groups
      
      - name: Process research projects
        run: make process-projects
      
      - name: Process scholarships
        run: make process-scholarships
      
      - name: Calculate student recurrence
        run: make calculate-recurrence
      
      - name: Aggregate data by student
        run: make aggregate-students
      
      - name: Aggregate data by supervisor
        run: make aggregate-supervisors
      
      - name: Analyze partnerships
        run: make analyze-partnerships
      
      - name: Generate network statistics
        run: make analyze-networks
      
      - name: Copy data files to docs
        run: make copy-data
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build documentation with MkDocs
        run: |
          cd onestep-static
          mkdocs build --clean --strict
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./onestep-static/site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
